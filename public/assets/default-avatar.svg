<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="pfpBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e7c7b" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>

    <!-- Skin Gradient -->
    <linearGradient id="pfpSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Hair Gradient -->
    <linearGradient id="pfpHair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Suit Gradient -->
    <linearGradient id="pfpSuit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Shirt Gradient -->
    <linearGradient id="pfpShirt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Tie Gradient -->
    <linearGradient id="pfpTie" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e7c7b" />
      <stop offset="100%" stop-color="#0a5f5e" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="pfpGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Circular Clip Mask -->
  <clipPath id="circleClip">
    <circle cx="80" cy="80" r="78" />
  </clipPath>

  <g clip-path="url(#circleClip)">
    <!-- Vibrant Background -->
    <rect width="160" height="160" fill="url(#pfpBg)" />

    <!-- Ambient lighting circles -->
    <circle cx="130" cy="30" r="45" fill="#38bdf8" opacity="0.3" />
    <circle cx="25" cy="140" r="50" fill="#a855f7" opacity="0.25" />

    <!-- Character Body / Shoulders -->
    <!-- Blazer -->
    <path d="M15 160 C15 125 45 110 80 110 C115 110 145 125 145 160 Z" fill="url(#pfpSuit)" filter="url(#pfpGlow)" />

    <!-- White Shirt V-neck -->
    <polygon points="62,110 98,110 80,145" fill="url(#pfpShirt)" />

    <!-- Tie -->
    <polygon points="76,120 84,120 86,155 80,162 74,155" fill="url(#pfpTie)" />
    <polygon points="74,116 86,116 83,122 77,122" fill="#0d9488" />

    <!-- Lapels -->
    <path d="M38 160 L62 110 L74 135 L48 160 Z" fill="#334155" />
    <path d="M122 160 L98 110 L86 135 L112 160 Z" fill="#334155" />

    <!-- Neck -->
    <path d="M68 92 L92 92 L92 112 L68 112 Z" fill="#f59e0b" />
    <path d="M68 96 C74 104 86 104 92 96 L92 108 C86 114 74 114 68 108 Z" fill="#d97706" opacity="0.4" />

    <!-- Head / Face -->
    <ellipse cx="80" cy="74" rx="26" ry="32" fill="url(#pfpSkin)" filter="url(#pfpGlow)" />

    <!-- Ears -->
    <circle cx="53" cy="74" r="7" fill="#f59e0b" />
    <circle cx="107" cy="74" r="7" fill="#f59e0b" />

    <!-- Cheeks (Warmth) -->
    <ellipse cx="64" cy="80" rx="5" ry="3" fill="#ef4444" opacity="0.25" />
    <ellipse cx="96" cy="80" rx="5" ry="3" fill="#ef4444" opacity="0.25" />

    <!-- Eyes -->
    <ellipse cx="68" cy="72" rx="3.5" ry="4" fill="#0f172a" />
    <ellipse cx="92" cy="72" rx="3.5" ry="4" fill="#0f172a" />
    <!-- Eye Highlights -->
    <circle cx="69" cy="71" r="1.2" fill="#ffffff" />
    <circle cx="93" cy="71" r="1.2" fill="#ffffff" />

    <!-- Eyebrows -->
    <path d="M62 64 Q68 61 74 64" stroke="#0f172a" stroke-width="2.8" stroke-linecap="round" fill="none" />
    <path d="M86 64 Q92 61 98 64" stroke="#0f172a" stroke-width="2.8" stroke-linecap="round" fill="none" />

    <!-- Nose -->
    <path d="M80 72 L78 78 L83 78" stroke="#d97706" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Confident Smile -->
    <path d="M70 85 Q80 94 90 85" stroke="#0f172a" stroke-width="2.4" stroke-linecap="round" fill="none" />
    <path d="M72 86 Q80 93 88 86 Z" fill="#ffffff" />

    <!-- Stylish Hair -->
    <path d="M52 68 C48 42 65 32 80 32 C98 32 112 40 108 68 C104 55 98 48 80 48 C66 48 56 55 52 68 Z" fill="url(#pfpHair)" />
    <!-- Hair Volume & Flow -->
    <path d="M54 55 C60 40 76 34 94 36 C105 38 110 44 111 52 C106 43 96 38 82 40 C68 42 58 48 54 55 Z" fill="#334155" opacity="0.6" />
  </g>

  <!-- Border Ring -->
  <circle cx="80" cy="80" r="78" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2" />
</svg>
